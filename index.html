<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseVault</title>
    <link rel="stylesheet" href="QuranQuote.css">
</head>
<body>
    <main class="login-container">
  <div class="login-card">
    <div id="QuranQuote">
      <div class="form-group">
        <div class="dropdown-group">
  <select id="role" name="role" class="custom-select">
    <option value="" disabled selected>Select Emotion/Topic</option>
    <option value="patience">Patient</option>
    <option value="mercy">Mercy</option>
    <option value="gratitude">Gratitude</option>
    <option value="hope">Hope</option>
    <option value="strength">Strength</option>
             
  </select>
</div>
      </div>

      <div class="verse-display">
                    <p id="arabicText" class="arabic-text" dir="rtl">Select a topic and generate</p>
                    <p id="translationText" class="translation-text">Verse translation will appear here...</p>
                    <span id="verseRef" class="verse-ref"></span>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button id="generateBtn" class="btn">Generate New Verse</button>
    </div>
  </div>
</main>
</body>
<script src="QuranQuote.js"></script>
</html>
